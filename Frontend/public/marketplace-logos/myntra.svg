<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Myntra dark rounded container for vivid contrast -->
  <rect width="200" height="200" rx="36" fill="#18181b"/>
  <!-- Myntra Overlapping Colored 'M' icon -->
  <g transform="translate(44, 42)">
    <!-- Left loop: vibrant pink / magenta -->
    <path d="M 0 52 C 0 32 16 16 34 16 C 50 16 62 28 66 44 C 54 58 44 72 32 86 C 14 78 0 66 0 52 Z" fill="#ff3f6c" opacity="0.95"/>
    <!-- Center-right loop: orange / warm coral -->
    <path d="M 46 84 C 56 70 66 56 76 42 C 82 26 94 16 110 16 C 128 16 142 32 142 52 C 142 66 128 78 110 86 C 88 86 66 84 46 84 Z" fill="#f97316" opacity="0.95"/>
    <!-- Overlapping center intersection: warm gold / yellow -->
    <path d="M 46 84 C 58 68 68 54 78 40 C 72 32 64 26 54 26 C 44 26 36 34 32 44 Z" fill="#fbbf24" opacity="0.9"/>
  </g>
  <!-- Wordmark -->
  <text x="100" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle" letter-spacing="3">MYNTRA</text>
  <text x="100" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a1a1aa" text-anchor="middle" letter-spacing="2">PARTNER</text>
</svg>
