
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>E-commerce website build</title>
    </head>

    <body>
      <div id="root">
        <style>
          .initial-loader {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; font-family: system-ui, -apple-system, sans-serif;
            background-color: #fcfbf8; color: #333; flex-direction: column;
          }
          .spinner {
            width: 48px; height: 48px; border: 4px solid #e2e8f0;
            border-top: 4px solid #b8860b; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 16px;
          }
          @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        </style>
        <div class="initial-loader">
          <div class="spinner"></div>
          <h2>Loading Store...</h2>
        </div>
      </div>
      <script type="module" src="/Frontend/main.tsx"></script>
    </body>
  </html>
