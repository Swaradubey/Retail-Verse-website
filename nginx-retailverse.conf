# Retail Verse — only answers for __DOMAIN__, so other sites on this server are unaffected.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    client_max_body_size 50M;   # product images, voice-order audio

    root /home/retailverse/app/dist;
    index index.html;

    # Backend API + uploaded files + websockets -> Node on localhost
    location ~ ^/(api|uploads|auth/google|socket\.io)(/|$) {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Long cache for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React single-page app
    location / {
        try_files $uri $uri/ /index.html;
    }
}

